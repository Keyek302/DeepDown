<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1926">
<meta name="description" content="Deep Down: an idle dungeon crawler. Build a party, descend, retire and go deeper.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deep Down">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Deep Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Grenze+Gotisch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone screen. Torch-lit pixel battle scene on top (the only bright spot), quiet stone ledger below. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --stone:#1a1926;      /* page */
  --slab:#252336;       /* cards */
  --seam:#3a3752;       /* borders */
  --bone:#ebe3cf;       /* text */
  --dust:#9c96ad;       /* muted text */
  --torch:#f0a13a;      /* accent: gold, buttons */
  --blood:#cf4a43;      /* enemy hp, damage */
  --moss:#6fbf8b;       /* hero hp, heals */
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--stone);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.3;
  display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px 6px}
#top h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1}
#gold{font-weight:700;font-size:20px;color:var(--torch);transform-origin:100% 50%;text-shadow:0 0 10px rgba(240,161,58,.25)}
#gold.pop{animation:gpop .35s ease-out}
@keyframes gpop{40%{transform:scale(1.12);color:#fff2b0}}
#gold small{font-weight:500;font-size:12px;color:var(--dust);margin-left:6px}

#stage{margin:0 16px;padding:8px 10px 10px;border:1px solid var(--zone,var(--seam));border-radius:10px;background:linear-gradient(180deg,#17162a,#121120);box-shadow:0 0 30px -10px var(--zone,transparent),inset 0 1px 0 rgba(255,255,255,.05);transition:border-color 1.2s,box-shadow 1.2s}
#floorline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--dust);padding:0 2px 6px}
#floorline b{font-family:var(--display);font-size:20px;color:var(--bone);font-weight:500}
#pips{display:flex;gap:4px}
#pips i{width:9px;height:9px;border:1px solid var(--dust);transform:rotate(45deg)}
#pips i.on{background:var(--torch);border-color:var(--torch)}
#arena{position:relative;display:block;width:100%;padding:0;border-radius:6px;overflow:hidden;line-height:0;user-select:none}
#scene{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0f0e18}
.float{position:absolute;pointer-events:none;line-height:1;font-weight:700;font-size:16px;color:var(--bone);text-shadow:0 1px 0 #000,0 0 3px #000;animation:rise .7s ease-out forwards}
.float.crit{color:var(--torch);font-size:21px}
.float.heal{color:var(--moss)}
.float.skill{font-family:var(--display);font-weight:700;font-size:16px;color:#fff2b0;white-space:nowrap;animation-duration:.95s}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--torch);text-shadow:0 2px 0 #000,0 0 14px rgba(207,74,67,.95);opacity:0;pointer-events:none}
#banner.show{animation:banner 1.7s ease-out}
@keyframes banner{0%{opacity:0;transform:scale(1.9)}14%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.95)}}
@keyframes rise{to{transform:translateY(-30px);opacity:0}}
#foeinfo{display:flex;align-items:center;gap:8px;margin-top:8px}
#foename{font-family:var(--display);font-size:20px;font-weight:500;white-space:nowrap}
#foename.boss{color:var(--torch)}
.bar{position:relative;flex:1;height:10px;background:#0f0e18;border:1px solid var(--seam);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;width:100%;background:var(--blood);transition:width .12s linear}
#foeghost{position:absolute;left:0;top:0;background:#f2e6c8;opacity:.7;transition:width .45s ease-in .2s}
#foefill{position:relative;background:linear-gradient(180deg,#ec6c62,#b03a33 60%,#8a2a25)}
#foeinfo.boss .bar{border-color:var(--torch);box-shadow:0 0 8px rgba(240,161,58,.35)}
#foehp{font-size:12px;color:var(--dust);min-width:74px;text-align:right}
#controls{display:flex;gap:8px;margin-top:8px}
#controls button{flex:1;padding:9px 8px;border-radius:6px;font-weight:600;font-size:14px;border:1px solid var(--seam);background:var(--slab)}
#rally.ready{background:var(--torch);color:#22180a;border-color:var(--torch)}
#rally.live{border-color:var(--torch);color:var(--torch)}
#auto.farm{border-color:var(--blood);color:#f0b1ad}

#tabs{display:flex;gap:4px;padding:10px 16px 0}
#tabs button{flex:1;padding:8px 1px;font-weight:600;font-size:13px;color:var(--dust);border-bottom:2px solid transparent}
.buy.arm{background:var(--blood);color:#fff}
.note{font-size:13px;color:var(--dust)}
.zoneh{font-family:var(--display);font-weight:500;font-size:19px;margin-top:6px}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.entry{background:var(--slab);border:1px solid var(--seam);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;color:var(--dust)}
.entry img{width:40px;height:40px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:0 auto 4px}
.entry b{display:block;color:var(--bone);font-weight:600;font-size:13px;line-height:1.15}
.entry.unk img{filter:brightness(0) opacity(.45)}
.stars{color:var(--torch);letter-spacing:1px}
#tabs button{border-radius:6px 6px 0 0;transition:color .2s,background .2s}
#tabs button[aria-selected="true"]{color:var(--bone);border-color:var(--torch);background:linear-gradient(180deg,transparent,rgba(240,161,58,.14))}
#tabs button.dot::after{content:"";display:inline-block;width:6px;height:6px;margin-left:3px;border-radius:50%;background:var(--torch);box-shadow:0 0 6px var(--torch);vertical-align:2px}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:9;transform:translate(-50%,-80px);max-width:calc(100% - 32px);padding:8px 14px;border:1px solid var(--torch);border-radius:999px;background:rgba(37,35,54,.96);box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 14px rgba(240,161,58,.3);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#toast b{color:var(--torch)}
#toast.show{animation:toast 3s ease-out}
@keyframes toast{0%{transform:translate(-50%,-80px)}10%,82%{transform:translate(-50%,0)}100%{transform:translate(-50%,-80px)}}
#embers{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#embers i{position:absolute;bottom:-8px;width:3px;height:3px;background:#f6b553;box-shadow:0 0 6px #f0782a;animation:ember linear infinite;opacity:0}
@keyframes ember{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(var(--dx),-105vh);opacity:0}}
#panel{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;background:linear-gradient(180deg,#2a2840,#222033);border:1px solid var(--seam);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.25)}
.card img{width:42px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;background:radial-gradient(circle at 50% 65%,rgba(240,161,58,.16),transparent 70%);border-radius:6px}
.hbar{height:5px;margin:5px 0 1px;background:#0f0e18;border:1px solid var(--seam);border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#8fd8a6,#4f9a6a);transition:width .15s linear}
.hbar i.low{background:linear-gradient(180deg,#ec6c62,#a8322c)}
.cbar{height:2px;margin-bottom:3px;border-radius:1px;background:#0f0e18;overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:var(--torch);box-shadow:0 0 4px var(--torch)}
.feat.done{opacity:.6}
.feat.ready{border-color:var(--torch);box-shadow:0 0 12px -2px rgba(240,161,58,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.feat .tick{color:var(--moss);font-weight:700;font-size:13px;padding:0 6px}
.feat .rew{color:var(--dust);font-size:12px;padding:0 4px;text-align:right}
.card.locked img{filter:brightness(0) opacity(.5)}
.card h3{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.05}
.card h3 span{font-family:var(--body);font-size:13px;color:var(--dust);font-weight:500;margin-left:6px}
.card p{font-size:13px;color:var(--dust)}
.card .stats{color:var(--bone);font-size:13px}
.gear{font-size:12px}
.r0{color:var(--dust)}.r1{color:#7fb2e6}.r2{color:#c08be8;text-shadow:0 0 6px rgba(192,139,232,.4)}.r3{color:var(--torch);text-shadow:0 0 7px rgba(240,161,58,.6)}
.buy{min-width:86px;padding:8px 10px;border-radius:6px;background:linear-gradient(180deg,#f7b95a,#e08f2a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #7a4814;color:#22180a;font-weight:700;font-size:14px;line-height:1.15}
.buy:not(:disabled):active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #7a4814}
.buy small{display:block;font-weight:600;font-size:12px}
.buy:disabled{background:transparent;box-shadow:none;color:var(--dust);border:1px solid var(--seam);cursor:default}
.upg{grid-template-columns:1fr auto}
#log{font-size:13px;color:var(--dust);display:flex;flex-direction:column;gap:4px}
#log b{color:var(--bone);font-weight:600}
#reset{align-self:flex-start;margin-top:10px;padding:8px 12px;border:1px solid var(--seam);border-radius:6px;color:var(--dust);font-size:13px}
#reset.arm{border-color:var(--blood);color:#f0b1ad}

#snd{align-self:center;margin-right:auto;padding:3px 9px;border:1px solid var(--seam);border-radius:999px;font-size:12px;font-weight:600;color:var(--bone)}
#snd.off,.trow button.off{color:var(--dust)}
#title{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(95% 60% at 50% 32%,rgba(74,62,120,.78),rgba(15,14,24,.97) 78%);transition:opacity .5s,visibility .5s}
#title.gone{opacity:0;visibility:hidden;pointer-events:none}
.tw{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#tagline{font-size:13px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--dust)}
#title h1{font-family:var(--display);font-weight:700;line-height:.8;text-align:left;animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
#title h1 span{display:block;font-size:84px;color:var(--bone);text-shadow:0 4px 0 #2a2740}
#title h1 span+span{margin-left:.55em;font-size:104px;color:var(--torch);text-shadow:0 5px 0 #6a3012,0 0 36px rgba(240,120,50,.5)}
#lineup{display:flex;gap:5px;align-items:flex-end;min-height:52px;margin:4px 0}
#lineup img{width:42px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;animation:hop 1.1s ease-in-out infinite}
#lineup img.off{filter:brightness(0) opacity(.4);animation:none}
#play{width:100%;padding:14px;font-size:19px}
.trow{display:flex;gap:8px;width:100%}
.trow button,#install{flex:1;padding:10px;border:1px solid var(--seam);border-radius:6px;background:var(--slab);font-weight:600;font-size:14px}
#install{width:100%;flex:none;border-color:var(--torch);color:var(--torch)}
#install[hidden]{display:none}
@keyframes hop{50%{transform:translateY(-5px)}}
@keyframes drop{from{opacity:0;transform:translateY(-40px)}}
#buffs{font-size:12px;font-weight:600;color:var(--torch);text-align:center;margin-top:6px}
#buffs:empty{display:none}
#event{width:100%;margin-top:8px;padding:10px;border-radius:6px;background:var(--torch);color:#22180a;font-weight:700;font-size:15px;animation:pulse 1s ease-in-out infinite alternate}
#event[hidden]{display:none}
@keyframes pulse{to{box-shadow:0 0 0 4px rgba(240,161,58,.3)}}
.card img.sq{width:44px;height:44px}
#choice{position:fixed;inset:0;background:rgba(10,9,16,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#choice.show{display:flex}
#choice>div{background:var(--slab);border:1px solid var(--torch);border-radius:10px;padding:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#choice h2{font-family:var(--display);font-weight:700;font-size:26px;text-align:center}
#choicetxt{font-size:13px;color:var(--dust);text-align:center}
#choiceopts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--seam);border-radius:8px;background:var(--stone);font-size:13px;color:var(--dust)}
.opt b{display:block;font-family:var(--display);font-weight:500;font-size:19px;color:var(--bone);line-height:1.1}
.opt:disabled{opacity:.45;cursor:default}
#away{position:fixed;inset:0;background:rgba(10,9,16,.8);display:none;align-items:center;justify-content:center;padding:16px}
#away.show{display:flex}
#away div{background:var(--slab);border:1px solid var(--torch);border-radius:10px;padding:20px;max-width:320px;text-align:center;display:flex;flex-direction:column;gap:10px}
#away h2{font-family:var(--display);font-weight:700;font-size:26px}
#away strong{color:var(--torch);font-size:24px}
@media (prefers-reduced-motion:reduce){#embers{display:none}#toast.show{animation:none;transform:translate(-50%,0)}#gold.pop{animation:none}#foeghost{transition:none}#lineup img,#title h1{animation:none}#title{transition:none}#event{animation:none}.float{animation-duration:.01s}.bar>span{transition:none}}
</style>
</head>
<body>
<header id="top">
  <h1>Deep Down</h1>
  <button id="snd">Sound on</button>
  <div id="gold" class="num">0 gold</div>
</header>

<section id="stage" aria-label="Battle">
  <div id="floorline"><span><b id="floor">Floor 1</b> · <span id="zone">Crypt</span></span><span id="pips"></span></div>
  <button id="arena" aria-label="Tap to strike the monster"><canvas id="scene" width="360" height="208"></canvas><span id="banner"></span></button>
  <div id="foeinfo"><span id="foename">…</span><span class="bar"><span id="foeghost"></span><span id="foefill"></span></span><span id="foehp" class="num"></span></div>
  <div id="buffs" class="num"></div>
  <button id="event" hidden></button>
  <div id="controls">
    <button id="rally">Rally</button>
    <button id="auto">Descending</button>
  </div>
</section>

<nav id="tabs" role="tablist">
  <button role="tab" data-tab="party" aria-selected="true">Party</button>
  <button role="tab" data-tab="upg" aria-selected="false">Upgrades</button>
  <button role="tab" data-tab="pets" aria-selected="false">Pets</button>
  <button role="tab" data-tab="souls" aria-selected="false">Souls</button>
  <button role="tab" data-tab="book" aria-selected="false">Book</button>
  <button role="tab" data-tab="log" aria-selected="false">Log</button>
</nav>
<main id="panel"></main>

<div id="title">
  <div id="embers" aria-hidden="true"></div>
  <div class="tw" style="position:relative">
    <p id="tagline">An idle dungeon crawl</p>
    <h1><span>Deep</span><span>Down</span></h1>
    <div id="lineup"></div>
    <button id="play" class="buy">Start the descent</button>
    <div class="trow"><button id="tsfx">Sound on</button><button id="tmusic">Music on</button></div>
    <button id="install" hidden>Install as an app</button>
    <p id="tsave" class="note"></p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="choice" role="dialog" aria-labelledby="choiceh"><div><h2 id="choiceh"></h2><p id="choicetxt"></p><div id="choiceopts"></div></div></div>

<div id="away" role="dialog" aria-labelledby="awayh">
  <div><h2 id="awayh">While you were away</h2><p id="awaytxt"></p><strong id="awaygold" class="num"></strong><button class="buy" id="awayok">Collect</button></div>
</div>

<script>
"use strict";
/* ---------- data ---------- */
const HEROES=[
 {id:"knight",name:"Knight",role:"Tank. Monsters aim at him first.",hp:60,atk:5,spd:1.2,cost:0,floor:1},
 {id:"archer",name:"Archer",role:"Fast, light arrows.",hp:35,atk:4,spd:0.6,cost:100,floor:1},
 {id:"cleric",name:"Cleric",role:"Heals the most wounded ally.",hp:40,atk:3,spd:1.5,cost:600,floor:5},
 {id:"mage",name:"Mage",role:"Slow, heavy spells.",hp:30,atk:22,spd:2.4,cost:2500,floor:10},
 {id:"rogue",name:"Rogue",role:"30% crits for triple. +15% gold.",hp:38,atk:7,spd:0.8,cost:12000,floor:18},
 {id:"berserker",name:"Berserker",role:"Hits harder the more hurt he is.",hp:70,atk:12,spd:1.1,cost:60000,floor:28}
];
const HMAP=Object.fromEntries(HEROES.map(h=>[h.id,h]));
const UPGS=[
 {id:"tap",name:"Heavy Hand",desc:"+25% tap damage",base:25,grow:1.5},
 {id:"atk",name:"Whetstones",desc:"+10% attack for the whole party",base:50,grow:1.6},
 {id:"hp",name:"Thick Hides",desc:"+10% health for the whole party",base:50,grow:1.6},
 {id:"gold",name:"Deep Pockets",desc:"+10% gold from kills",base:80,grow:1.7}
];
/* mobs: [name, sprite key]. Every monster has its own sprite in MOB_ART. */
const ZONES=[
 {name:"Crypt",tint:"#5a5288",mobs:[["Bone Rat","rat"],["Grave Moth","moth"],["Skeleton","skel"],["Tomb Slime","slime"],["Wight","wight"],["Crypt Spider","spider"],["Zombie","zombie"]],boss:["The Gravekeeper","keeper"]},
 {name:"Fungal Caves",tint:"#3a6e5c",mobs:[["Sporeling","spore"],["Cave Leech","leech"],["Mold Hound","hound"],["Capstalker","stalker"],["Glow Beetle","glow"],["Puffball","puff"],["Vine Creeper","vine"]],boss:["Mother Mycelia","mother"]},
 {name:"Lava Works",tint:"#8a4434",mobs:[["Ember Imp","imp"],["Slag Crab","crab"],["Cinder Bat","cbat"],["Forge Golem","forge"],["Ash Wraith","ash"],["Magma Slug","slug"],["Fire Elemental","flame"]],boss:["The Smelter King","king"]},
 {name:"Ice Vault",tint:"#3a6a8c",mobs:[["Frost Mite","mite"],["Rime Wolf","rime"],["Icebound Knight","iknight"],["Snow Shade","shade"],["Glacier Worm","gworm"],["Yeti","yeti"],["Ice Shard","shard"]],boss:["Warden of the Vault","warden"]},
 {name:"Dragon's Lair",tint:"#7c6428",mobs:[["Kobold","kobold"],["Drake Whelp","whelp"],["Hoard Mimic","mimic"],["Scale Guard","guard"],["Wyvern","wyvern"],["Treasure Golem","tgolem"],["Dragon Cultist","cultist"]],boss:["Old Cindermaw","maw"]},
 {name:"Sunken Temple",tint:"#2f6f7a",mobs:[["Drowned Sailor","drowned"],["Moon Jelly","jelly"],["Fishfolk","fish"],["Sea Eel","eel"],["Coral Brute","coral"],["Siren","siren"],["Anglerfish","angler"]],boss:["The Drowned Prophet","prophet"]},
 {name:"The Abyss",tint:"#4a3070",mobs:[["Void Eye","veye"],["Nightmare","nightmare"],["Grasping Hand","hand"],["Starspawn","star"],["Faceless Monk","monk"],["Rift Stalker","rift"],["Gibbering Maw","gmaw"]],boss:["The Unmaker","unmaker"]}
];
const RCOL=["220,220,230","127,178,230","192,139,232","240,161,58"],RHEX=["#ebe3cf","#9cc6f0","#d4a8f2","#f6b553"];
const RAR=[{n:"Common",m:1,p:.70},{n:"Rare",m:1.6,p:.22},{n:"Epic",m:2.5,p:.07},{n:"Legendary",m:4,p:.01}];
const WEAPONS=["Blade","Bow","Mace","Staff","Dagger","Axe"],ARMORS=["Mail","Jerkin","Robes","Cowl","Leathers","Hide"];
const PREFIX=["Rusty","Sturdy","Keen","Gilded","Runed","Haunted","Dragonbone"];
const MOB_T=1.5, AWAY_CAP=8*3600, AWAY_RATE=.5;
/* soul upgrades: bought with shards, kept through every prestige */
const PUPS=[

  const pow=Math.round((5+s.floor*2)*RAR[ri].m*(0.8+Math.random()*0.4)*(1+.2*R("magpie")));
  const base=(slot==="weapon"?WEAPONS:ARMORS)[HEROES.indexOf(h)],name=PREFIX[Math.min(PREFIX.length-1,Math.floor(Math.random()*3)+ri+Math.floor(s.floor/20))]+" "+base;
  const cur=s.heroes[h.id][slot];
  if(!cur||pow>cur.pow){s.heroes[h.id][slot]={name,rar:ri,pow};fx.h[h.id].rise=1;sfx("gear");const hp=POS[h.id];
    fx.beams.push({x:hp[0]+10,y:hp[1]+24,l:.5+ri*.25,c:RCOL[ri]});float(name,"skill",Math.max(1,(hp[0]-8)/W*100),(hp[1]-14)/H*100,RHEX[ri]);
    if(ri===3){s.st.legend++;showBanner("Legendary!");fx.flash=Math.max(fx.flash,.4);sfx("relic")}log(`<b>${h.name}</b> equipped <span class="r${ri}">${name}</span> (+${pow}% ${slot==="weapon"?"attack":"health"}).`);rt.dirty=true}
  else{const g=rt.mob.gold*2;s.gold+=g;rt.earn+=g}}
function kill(){const g=rt.mob.gold*(1+0.1*s.upg.gold)*(s.heroes.rogue?1.15:1)*(1+0.3*P("midas"))*(1+.4*R("purse"))*(1+petB("wisp"))*(s.buffs.gold>0?2:1);
  s.st.kills++;s.st.gold+=g;if(rt.mob.elite)s.st.elites++;
  if(!calm){const gd=$("gold");gd.classList.remove("pop");void gd.offsetWidth;gd.classList.add("pop")}
  const bn=rt.mob.base||rt.mob.name,bc=s.book[bn]=(s.book[bn]||0)+1;
  if(BOOK_T.includes(bc)){bookRecalc();if(bc===1)log(`New in the monster book: <b>${bn}</b>.`);if(rt.tab==="book")rt.dirty=true}s.gold+=g;rt.earn+=g;float("+"+fmt(g)+"g","crit",70,rt.mob.boss?18:36);
  burst();sfx(rt.mob.boss?"bossdown":"kill");sfx("coin",.2);
  if(rt.mob.boss||rt.mob.elite||Math.random()<0.12+0.03*P("luck")+.05*R("magpie")+petB("magpie"))drop(rt.mob.elite?1:0);
  if(rt.mob.boss)bossLoot();if(rt.mob.elite)log(`Elite <b>${rt.mob.name}</b> defeated.`);
  if(rt.mob.boss)log(`<b>${rt.mob.name}</b> is slain. The way down opens.`);
  s.kills++;healAll(0.1+.15*R("leech"),false);
  if(s.kills>=need(s.floor)){s.kills=0;healAll(0.5,true);maybeTreasure();fx.cheer=1;
    if(s.auto){s.floor++;fx.walk=1;sfx("floor");if(s.floor>s.best){s.best=s.floor;s.allBest=Math.max(s.allBest||1,s.best);rt.dirty=true}}}
  spawn()}
function wipe(){sfx("wipe");log(`The party was wiped on floor ${s.floor}. Falling back to regroup.`);s.floor=Math.max(1,s.floor-1);s.auto=false;s.kills=0;healAll(1,true);fx.fade=1;spawn()}
function step(dt){
  if(s.buffs.atk>0)s.buffs.atk-=dt;if(s.buffs.gold>0)s.buffs.gold-=dt;
  if(s.rallyT>0)s.rallyT=Math.max(0,s.rallyT-dt);if(s.rallyCd>0)s.rallyCd=Math.max(0,s.rallyCd-dt);
  const haste=(s.rallyT>0?2:1)*(1+.12*R("hour"));
  for(const h of alive()){rt.timer[h.id]=(rt.timer[h.id]||0)+dt*haste;
    while(rt.timer[h.id]>=h.spd&&rt.mob.hp>0){rt.timer[h.id]-=h.spd;act(h)}}
  petAct(dt*haste);
  if(rt.mob.hp<=0){kill();return}
  const m=rt.mob;if(m.boss&&!m.enraged&&m.hp<m.max*.3){m.enraged=true;showBanner("Enraged!");fx.shake=.7;log(`<b>${m.name}</b> flies into a rage.`)}
  if(m.stun>0)m.stun-=dt;else m.t+=dt*(m.enraged?1.4:1)*(m.elite==="swift"?1.6:1);
  if(m.t>=MOB_T){m.t-=MOB_T;mobAct();if(!alive().length)wipe()}
}

function P(id){return s.pu[id]||0}
function awayRate(){return AWAY_RATE+0.1*P("idle")}
function pupCost(u){return Math.ceil(u.base*Math.pow(u.grow,P(u.id)))}

function shardGain(){return s.best<PRESTIGE_FLOOR?0:Math.floor(Math.pow(s.best-10,1.25)/2)}

  owned().forEach(h=>{if(rt.hp[h.id]>0)rt.hp[h.id]=Math.min(rt.hp[h.id],heroStats(h.id).hp)});rt.dirty=true}
function prestige(){const g=shardGain();if(g<=0)return;sfx("prestige");s.shards+=g;s.totalShards+=g;s.prestiges++;
  const f=1+5*P("head");s.gold=0;s.floor=f;s.best=f;s.kills=0;s.auto=true;s.heroes={knight:{lvl:1+5*P("drill"),weapon:null,armor:null}};

  else if(rt.tab==="pets"){h+=`<p class="note">Eggs come from bosses and merchants. Every pet you own gives its bonus; the active one fights and gives double. Duplicate eggs level a pet up.</p>`;
    for(const p of PETS){const l=s.pets[p.id]||0,url=mobSprite(p.art,false).url,act=s.pet===p.id;
      const d=p.id==="drake"?"Breathes fire for double pet damage":`+${Math.round(l*p.v*100*(act?2:1))}% ${p.what}`;
      h+=l?`<div class="card"><img class="sq" src="${url}" alt=""><div><h3>${p.name}<span>Lv ${l}</span></h3><p>${d}</p></div><button class="buy" data-act="pet" data-id="${p.id}" data-cost="${act?Infinity:0}">${act?"Active":"Set active"}</button></div>`
           :`<div class="card locked"><img class="sq" src="${url}" alt=""><div><h3>???</h3><p>Hatches from an egg</p></div><span></span></div>`}}
  else if(rt.tab==="souls"){const g=shardGain();
    h+=`<div class="card upg"><div><h3>Soul shards<span class="num">${s.shards} to spend</span></h3>
      <p>Retire the party and start over from floor ${1+5*P("head")}. Gold, heroes, gear and gold upgrades reset. Shards, soul upgrades and the monster book stay.</p>
      <p class="num">Runs retired: ${s.prestiges} · Deepest ever: floor ${Math.max(s.allBest||1,s.best)}</p></div>
      <button class="buy" data-act="prestige" data-cost="${g>0?0:Infinity}">${g>0?`Retire<small class="num">+${g} shards</small>`:`Reach<small>floor ${PRESTIGE_FLOOR}</small>`}</button></div>`;
    const featCard=f=>{const st=s.feats[f.id]||0;return`<div class="card upg feat${st===1?" ready":st===2?" done":""}"><div><h3>${f.name}</h3><p>${f.desc}</p></div>${st===1?`<button class="buy" data-act="feat" data-id="${f.id}" data-cost="0">Claim<small class="num">+${f.r} shard${f.r===1?"":"s"}</small></button>`:st===2?`<span class="tick">✓ Done</span>`:`<span class="rew num">${f.r} shard${f.r===1?"":"s"}</span>`}</div>`};
    h+=FEATS.filter(f=>s.feats[f.id]===1).map(featCard).join("");
    for(const u of PUPS){const lv=P(u.id),maxed=u.max&&lv>=u.max,c=pupCost(u);
      h+=`<div class="card upg"><div><h3>${u.name}<span>Lv ${lv}${u.max?" / "+u.max:""}</span></h3><p>${u.desc}</p></div>
        <button class="buy" data-act="pup" data-cur="shards" data-id="${u.id}" data-cost="${maxed?Infinity:c}">${maxed?"Maxed":`Buy<small class="num">${c} shard${c===1?"":"s"}</small>`}</button></div>`}
    const got=FEATS.filter(f=>s.feats[f.id]).length;
    h+=`<h3 class="zoneh">Feats</h3><p class="note num">${got} of ${FEATS.length} earned. Each pays soul shards once and is kept through every retirement.</p>`;
    h+=FEATS.filter(f=>!s.feats[f.id]).concat(FEATS.filter(f=>s.feats[f.id]===2)).map(featCard).join("")}
  else if(rt.tab==="book"){const total=ZONES.reduce((n,z)=>n+z.mobs.length+1,0),found=Object.keys(s.book).length;
    h+=`<p class="note num">Found ${found} of ${total}. Stars: ${rt.stars||0}, each worth +1% party attack. A monster earns stars at 1, 25, 100 and 500 kills.</p>`;
    for(const z of ZONES){h+=`<h3 class="zoneh">${z.name}</h3><div class="book">`;
      z.mobs.concat([z.boss]).forEach((m,i)=>{const boss=i===z.mobs.length,c=s.book[m[0]]||0,st=bookStars(m[0]),url=mobSprite(m[1],boss).url;
        h+=c?`<div class="entry"><img src="${url}" alt=""><b>${m[0]}</b><span class="stars">${"★".repeat(st)}${"☆".repeat(4-st)}</span><br><span class="num">${fmt(c)} slain${boss?" · boss":""}</span></div>`
            :`<div class="entry unk"><img src="${url}" alt=""><b>???</b>${boss?"Boss":"Not yet met"}</div>`});
      h+=`</div>`}}
  else{h=`<div id="log">${s.log.map(l=>`<p>${l}</p>`).join("")}</div><button id="reset">Reset save</button>`}
  p.innerHTML=h;rt.dirty=false}
function renderLive(){
  $("gold").innerHTML=fmt(s.gold)+" gold"+(s.gps>0?`<small>${fmt(s.gps)}/s</small>`:"");
  const m=rt.mob;$("foefill").style.width=Math.max(0,m.hp/m.max*100)+"%";$("foehp").textContent=fmt(Math.max(0,m.hp))+" / "+fmt(m.max);
  const r=$("rally");r.className=s.rallyT>0?"live":s.rallyCd>0?"":"ready";
  r.textContent=s.rallyT>0?`Rally ${Math.ceil(s.rallyT)}s`:s.rallyCd>0?`Rally in ${Math.ceil(s.rallyCd)}s`:"Rally: double speed";
  const ev=$("event"),p0=s.pending[0];ev.hidden=!p0;if(p0)ev.textContent=EVLABEL[p0.type]+(s.pending.length>1?` (+${s.pending.length-1} more)`:"");
  $("buffs").textContent=[s.buffs.atk>0?`Might ${Math.ceil(s.buffs.atk)}s`:"",s.buffs.gold>0?`Fortune ${Math.ceil(s.buffs.gold)}s`:""].filter(Boolean).join(" · ");
  const a=$("auto");a.className=s.auto?"":"farm";a.textContent=s.auto?"Descending":"Farming · tap to push on";
  document.querySelectorAll("#panel .buy").forEach(b=>b.disabled=(b.dataset.cur==="shards"?s.shards:s.gold)<Number(b.dataset.cost));
  if(rt.tab==="party"){document.querySelectorAll("#panel [data-hp]").forEach(e=>{const id=e.dataset.hp,f=Math.max(0,(rt.hp[id]||0)/heroStats(id).hp);e.style.width=f*100+"%";e.classList.toggle("low",f<.35)});
    document.querySelectorAll("#panel [data-ch]").forEach(e=>{e.style.width=Math.min(1,(rt.charge[e.dataset.ch]||0)/specEvery())*100+"%"})}
  const souls=document.querySelector('#tabs [data-tab="souls"]');souls.classList.toggle("dot",FEATS.some(f=>s.feats[f.id]===1)||(shardGain()>0&&s.shards===0&&!s.prestiges))}

/* ---------- sound: everything is synthesised, no audio files ---------- */
const SET_KEY="deepdown.settings.v1";
const opt=(()=>{try{return Object.assign({sfx:true,music:true},JSON.parse(localStorage.getItem(SET_KEY)))}catch(e){return{sfx:true,music:true}}})();
function saveOpt(){try{localStorage.setItem(SET_KEY,JSON.stringify(opt))}catch(e){}}
let AC=null,master=null,musicGain=null,noiseBuf=null,musicTimer=null,mStep=0,began=false;const sfxLast={};
function audioInit(){if(AC)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(master);
  noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.6),AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(type,f0,f1,dur,vol,delay,dest){const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol,freq,q,delay,type){const t=AC.currentTime+(delay||0),n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=noiseBuf;f.type=type||"bandpass";f.frequency.value=freq;f.Q.value=q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.03)}
const SFX={
 hit(){noise(.07,.2,1800,1.2);tone("square",180,90,.06,.07)},
 crit(){noise(.1,.28,2600,1);tone("square",520,260,.12,.13);tone("triangle",1040,780,.1,.08,.02)},
 tap(){noise(.05,.2,3400,2);tone("triangle",700,300,.06,.1)},
 shoot(){noise(.06,.1,4200,3);tone("sine",900,500,.07,.05)},
 spell(){tone("sine",500,1400,.18,.1);tone("triangle",750,2100,.18,.05)},
 heal(){tone("sine",660,660,.14,.09);tone("sine",990,990,.2,.07,.07)},
 hurt(){tone("sawtooth",160,70,.1,.09);noise(.06,.1,500,1)},
 coin(){tone("square",1320,1320,.05,.05);tone("square",1760,1760,.09,.05,.05)},
 kill(){noise(.16,.2,900,.8);tone("triangle",300,80,.16,.1)},
 special(){tone("sawtooth",220,880,.22,.08);tone("square",440,1760,.22,.05,.03)},
 meteor(){tone("sawtooth",900,120,.3,.1);noise(.45,.4,300,.7,.28,"lowpass");tone("sine",90,40,.4,.3,.28)},
 slam(){noise(.4,.45,220,.7,0,"lowpass");tone("sine",110,35,.4,.35)},
 roar(){tone("sawtooth",110,55,.7,.2);tone("sawtooth",164,60,.7,.12);noise(.6,.2,400,.6,0,"lowpass")},
 bossdown(){[523,659,784,1047].forEach((f,i)=>tone("square",f,f,.16,.08,i*.09));noise(.5,.3,600,.6)},
 floor(){tone("triangle",392,392,.08,.07);tone("triangle",587,587,.12,.07,.08)},
 wipe(){[392,330,262,196].forEach((f,i)=>tone("triangle",f,f*.97,.22,.12,i*.14))},
 buy(){tone("square",660,660,.05,.06);tone("square",880,880,.08,.06,.05)},
 gear(){tone("triangle",880,880,.07,.08);tone("triangle",1175,1175,.07,.08,.06);tone("triangle",1568,1568,.14,.08,.12)},
 relic(){[392,494,587,784,988].forEach((f,i)=>tone("sine",f,f,.3,.09,i*.07))},
 egg(){[660,880,660,1100].forEach((f,i)=>tone("square",f,f,.08,.06,i*.08))},
 rally(){tone("sawtooth",196,196,.18,.1);tone("sawtooth",294,294,.3,.1,.14)},
 prestige(){[262,330,392,523,659,784].forEach((f,i)=>tone("sine",f,f,.5,.08,i*.1))},
 click(){tone("square",500,500,.03,.04)},
 event(){tone("sine",784,784,.12,.08);tone("sine",1175,1175,.2,.08,.1)}
};
function sfx(name,gap){if(!AC||!opt.sfx||!began||document.hidden)return;const now=AC.currentTime;if(now-(sfxLast[name]||-9)<(gap||.06))return;sfxLast[name]=now;try{SFX[name]()}catch(e){}}
/* music: a slow generated loop — bass drone plus sparse minor plucks, with a pulse on boss floors */
const SCALE=[110,130.81,146.83,164.81,196,220,261.63,293.66];
function musicTick(){if(!AC||!opt.music||document.hidden)return;const t=mStep++;try{
  if(t%8===0){const root=[55,55,43.65,49][(t/8|0)%4];tone("sine",root,root,2.7,.5,0,musicGain);tone("triangle",root*2,root*2,2.4,.1,0,musicGain)}
  if(t%2===0||Math.random()<.3){const f=SCALE[Math.floor(Math.random()*SCALE.length)]*(Math.random()<.3?2:1);tone("triangle",f,f,.9,.09,0,musicGain)}
  if(rt.mob&&rt.mob.boss&&t%2===0)tone("square",55,55,.12,.1,0,musicGain)}catch(e){}}
function musicSet(){if(!AC)return;musicGain.gain.setTargetAtTime(opt.music?.55:0,AC.currentTime,.3);if(opt.music&&!musicTimer)musicTimer=setInterval(musicTick,330)}

/* ---------- title screen ---------- */
function soundUI(){$("tsfx").textContent=opt.sfx?"Sound on":"Sound off";$("tmusic").textContent=opt.music?"Music on":"Music off";
  $("tsfx").classList.toggle("off",!opt.sfx);$("tmusic").classList.toggle("off",!opt.music);
  const any=opt.sfx||opt.music;$("snd").textContent=any?"Sound on":"Muted";$("snd").classList.toggle("off",!any)}
function setSound(a,b){opt.sfx=a;opt.music=b;saveOpt();audioInit();if(AC&&AC.state==="suspended")AC.resume();musicSet();soundUI()}
function begin(){if(began)return;began=true;audioInit();if(AC&&AC.state==="suspended")AC.resume();musicSet();sfx("rally");
  $("title").classList.add("gone");prev=performance.now();setInterval(frame,100);if(rt.away)rt.away()}
function setupTitle(saved,hot){soundUI();
  $("tsfx").onclick=()=>setSound(!opt.sfx,opt.music);$("tmusic").onclick=()=>setSound(opt.sfx,!opt.music);
  $("snd").onclick=()=>{const any=opt.sfx||opt.music;setSound(!any,!any)};
  $("play").onclick=begin;
  $("install").onclick=()=>{if(rt.install){rt.install.prompt();rt.install=null;$("install").hidden=true}};
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();rt.install=e;$("install").hidden=false});
  document.addEventListener("pointerdown",()=>{if(AC&&AC.state==="suspended")AC.resume()});
  if(hot){begin();return}
  $("play").textContent=saved?`Continue on floor ${s.floor}`:"Start the descent";
  $("tsave").textContent=saved?`Deepest floor ${Math.max(s.allBest||1,s.best)} · ${owned().length} of ${HEROES.length} heroes · ${s.prestiges} runs retired`:"Your party keeps fighting while you are away.";
  $("embers").innerHTML=calm?"":Array.from({length:22},()=>`<i style="left:${Math.random()*100}%;--dx:${(Math.random()-.5)*80}px;animation-duration:${6+Math.random()*7}s;animation-delay:${-Math.random()*12}s;width:${2+Math.random()*3|0}px;height:${2+Math.random()*3|0}px"></i>`).join("");
  $("lineup").innerHTML=HEROES.map((h,i)=>`<img src="${HS[h.id].url}" alt="${h.name}" class="${s.heroes[h.id]?"":"off"}" style="animation-delay:${i*.12}s">`).join("");
  /* offline install: only when served as a real site, never inside an embedded frame */
  try{if("serviceWorker" in navigator&&location.protocol==="https:"&&window.top===window)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}

/* ---------- loop ---------- */
let prev=performance.now();
function frame(){const now=performance.now();let dt=(now-prev)/1000;prev=now;
  if(dt>5){s.gold+=s.gps*dt*awayRate();dt=0.1}
  while(dt>0){const d=Math.min(dt,0.2);step(d);dt-=d}
  rt.earnT+=0.1;if(rt.earnT>=5){s.gps=s.gps*0.5+(rt.earn/rt.earnT)*0.5;rt.earn=0;rt.earnT=0}
  rt.saveT+=0.1;if(rt.saveT>=10){rt.saveT=0;save()}
  rt.featT+=0.1;if(rt.featT>=1){rt.featT=0;checkFeats()}
  if(rt.dirty)renderPanel();renderLive()}

/* ---------- boot ---------- */
function start(data){
  const hot=data&&data.heroes?data:null,saved=hot||load();if(saved)s=Object.assign(fresh(),saved);bookRecalc();
  owned().forEach(h=>rt.hp[h.id]=heroStats(h.id).hp);spawn();
  rt.away=()=>{if(!hot&&saved){const secs=Math.min(AWAY_CAP,(Date.now()-s.last)/1000);const g=s.gps*secs*awayRate();
    if(secs>60&&g>=1){s.gold+=g;const m=Math.floor(secs/60);$("awaytxt").textContent=`Your party kept fighting on floor ${s.floor} for ${m>=60?Math.floor(m/60)+"h "+(m%60)+"m":m+" min"}.`;$("awaygold").textContent="+"+fmt(g)+" gold";$("away").classList.add("show")}}};
  $("event").onclick=openEvent;
  $("choiceopts").onclick=e=>{const b=e.target.closest("button");if(b)pickOption(+b.dataset.i)};
  $("choice").onclick=e=>{if(e.target.id==="choice")$("choice").classList.remove("show")};
  $("awayok").onclick=()=>$("away").classList.remove("show");
  $("arena").onclick=()=>{if(rt.mob.hp>0){fx.slash=1;sfx("tap");hitMob(tapDmg(),false)}};
  $("rally").onclick=()=>{if(s.rallyCd<=0&&s.rallyT<=0){sfx("rally");s.rallyT=10+5*R("bell");s.rallyCd=60-5*P("rally")}};
  $("auto").onclick=()=>{s.auto=!s.auto};
  $("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;sfx("click");rt.tab=b.dataset.tab;
    document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));rt.dirty=true};
  $("panel").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.id==="reset"){if(b.classList.contains("arm")){try{localStorage.removeItem(KEY)}catch(_){}s=fresh();bookRecalc();rt.hp={};rt.timer={};owned().forEach(h=>rt.hp[h.id]=heroStats(h.id).hp);spawn();rt.tab="party";
        document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="party"));rt.dirty=true}
      else{b.classList.add("arm");b.textContent="Tap again to erase everything"}return}
    const id=b.dataset.id;if(b.dataset.act==="lvl")lvlHero(id);else if(b.dataset.act==="hero")buyHero(id);else if(b.dataset.act==="upg")buyUpg(id);else if(b.dataset.act==="pup")buyPup(id);else if(b.dataset.act==="pet"){s.pet=id;rt.dirty=true}else if(b.dataset.act==="feat")claimFeat(id);
    else if(b.dataset.act==="prestige"){if(b.classList.contains("arm"))prestige();else{b.classList.add("arm");b.innerHTML="Tap again<small>to retire</small>"}}};
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&began)save()});
  window.claude?.hot?.snapshot?.(()=>{s.last=Date.now();return s});
  renderPanel();renderLive();requestAnimationFrame(draw);setupTitle(!!saved,!!hot)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
